<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFLIX</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; }
  .view { display: none; }
  .view.on { display: block; }
  .panel { max-width: 420px; margin: 8vh auto; padding: 32px; background: rgba(0,0,0,.7); border-radius: 8px; }
  input, select { width: 100%; padding: 10px; margin: 6px 0; background: #333; color: #fff; border: 0; border-radius: 4px; }
  .row__rail { display: flex; gap: 10px; overflow-x: auto; padding: 0 4%; }
  .tile { width: 160px; height: 240px; flex: none; border-radius: 6px; display: flex; align-items: flex-end; padding: 8px; font-weight: 700; cursor: pointer; }
  nav.app { display: flex; gap: 16px; align-items: center; padding: 16px 4%; }
  nav.app .logo { color: #e50914; font-weight: 900; font-size: 26px; }
  #player { min-height: 70vh; background: #111; padding: 8vh 4%; }
</style>
</head>
<body>

<section id="view-auth" class="view on">
  <div class="panel">
    <h1>Sign in to CFLIX</h1>
    <input id="auth-email" placeholder="Email">
    <input id="auth-password" type="password" placeholder="Password">
    <button class="btn btn--red btn--full" id="btn-signin">Sign In</button>
    <button class="btn btn--ghost btn--full" id="btn-signup">New? Sign Up</button>
    <hr style="margin:16px 0;border-color:#333">
    <button class="btn btn--ghost btn--full" id="btn-google">Sign in with Google</button>
    <p id="auth-error" style="color:#eb3942"></p>
  </div>
</section>

<section id="view-profiles" class="view">
  <div class="panel">
    <h1>Who's watching?</h1>
    <div id="profile-list" style="display:flex;gap:12px;flex-wrap:wrap;margin:16px 0"></div>
    <input id="new-profile-name" placeholder="New profile name">
    <select id="new-profile-maturity">
      <option value="adult">Adult</option>
      <option value="teen">Teen</option>
      <option value="child">Child</option>
    </select>
    <button class="btn btn--red btn--full" id="btn-add-profile">Add Profile</button>
    <button class="btn btn--ghost btn--full" id="btn-logout-1">Sign out</button>
  </div>
</section>

<section id="view-home" class="view">
  <nav class="app">
    <span class="logo">CFLIX</span>
    <input id="search" placeholder="Search movies or series" style="width:260px;margin:0">
    <button class="btn btn--ghost btn--sm" id="btn-search">Search</button>
    <span style="flex:1"></span>
    <span id="who"></span>
    <button class="btn btn--ghost btn--sm" id="btn-switch">Switch profile</button>
    <button class="btn btn--ghost btn--sm" id="btn-logout-2">Sign out</button>
  </nav>
  <div id="search-results"></div>
  <h2 style="margin:0 0 12px;padding:0 4%">Movies</h2>
  <div class="row__rail" id="row-movies"></div>
  <h2 style="margin:24px 0 12px;padding:0 4%">Web Series</h2>
  <div class="row__rail" id="row-series"></div>
</section>

<section id="view-detail" class="view">
  <div style="padding:4vh 4%">
    <button class="btn btn--ghost btn--sm" id="btn-back">← Back</button>
    <h1 id="detail-title"></h1>
    <p id="detail-synopsis" style="max-width:640px;color:#ccc"></p>
    <button class="btn btn--play" id="btn-play">Play</button>
    <div id="detail-episodes" style="margin-top:24px"></div>
  </div>
</section>

<section id="view-player" class="view">
  <div id="player">
    <h1 id="player-title"></h1>
    <p id="player-info" style="color:#aaa"></p>
    <p>Simulated player. Progress reports every 10s; resume position shown below.</p>
    <p>Resumed at: <span id="player-resume">0</span>s</p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn--ghost btn--sm" id="btn-finish">Mark watched</button>
      <button class="btn btn--ghost btn--sm" id="btn-exit-player">Exit</button>
    </div>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
