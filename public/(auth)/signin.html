<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <script type="module" src="/js/pages/nav.js"></script>
    <style>
      .auth-stage {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: #0a0a0a url('/auth-bg.webp') center/cover no-repeat;
        padding: 110px 4% 70px;
      }
      .auth-stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            70% 82% at 50% 44%,
            rgba(0, 0, 0, 0.93) 0%,
            rgba(0, 0, 0, 0.87) 55%,
            rgba(0, 0, 0, 0.6) 100%
          ),
          linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 30%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 45%);
      }
      .auth-col {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 450px;
      }
    </style>
  </head>
  <body class="shell" data-page="sign-in">
    <nav class="nav">
      <a class="nav__logo" href="/">
        <svg viewBox="0 0 124 44" aria-hidden="true">
          <defs><path id="arc-nav" d="M4 38 Q62 10 120 38" /></defs>
          <text>
            <textPath href="#arc-nav" startOffset="50%" text-anchor="middle">
              CFLIX
            </textPath>
          </text>
        </svg>
      </a>
      <div class="nav__spacer"></div>
      <div class="nav__tools" hidden>
        <button
          type="button"
          class="nav__bell"
          aria-disabled="true"
          title="Notifications are not implemented yet"
          aria-label="Notifications, not implemented yet"
        >
          <svg
            class="nav__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5.2-2 5.2h15s-2-1.2-2-5.2A5.5 5.5 0 0 0 12 3.5z"
            />
            <path d="M10.2 18.2a2 2 0 0 0 3.6 0" />
          </svg>
        </button>
        <button
          type="button"
          class="nav__avatar"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Profile menu"
        >
          <span class="nav__avatar-pic"></span>
        </button>
        <div
          class="nav__menu"
          id="nav-menu"
          role="menu"
          aria-label="Profile menu"
          hidden
        ></div>
      </div>
    </nav>
    <section class="auth-stage">
      <div class="auth-col">
        <div class="auth auth--center">
          <h1 class="auth-title">Sign In</h1>

          <div class="field field--focus">
            <div class="field__box">
              <input
                id="in-email"
                placeholder="Email or phone number"
                style="
                  background: transparent;
                  border: 0;
                  color: #fff;
                  width: 100%;
                  outline: none;
                  font-size: inherit;
                "
              />
            </div>
          </div>

          <div class="field">
            <div class="field__box">
              <input
                id="in-password"
                type="password"
                placeholder="Password"
                style="
                  background: transparent;
                  border: 0;
                  color: #fff;
                  width: 100%;
                  outline: none;
                  font-size: inherit;
                "
              />
            </div>
          </div>

          <button class="btn btn--red btn--full" id="btn-signin" type="button">
            Sign In
          </button>

          <div class="auth-divider">OR</div>

          <button
            class="btn btn--ghost btn--full"
            id="btn-signup"
            type="button"
          >
            Sign Up
          </button>
          <button
            class="btn btn--ghost btn--full"
            id="btn-google"
            type="button"
            style="margin-top: 8px"
          >
            Sign in with Google
          </button>
          <p id="in-error" style="color: #eb3942; min-height: 1em"></p>

          <label class="auth-check">
            <i></i>
            <span>Remember me</span>
          </label>

          <p class="auth-fine">
            By signing in you agree to our terms and privacy policy.
          </p>
        </div>
      </div>
    </section>

    <script type="module" src="/wire.js"></script>
  </body>
</html>
