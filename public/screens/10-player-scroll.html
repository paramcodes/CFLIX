<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player at rest</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .player { width: 100%; height: 100vh; aspect-ratio: auto; }
  .note { position: absolute; right: 4%; bottom: 60px; z-index: 3; }
  .speed__ticks span, .speed__ticks b { white-space: nowrap; }
</style>
</head>
<body class="shell" data-page="player">
<main class="player">
  <div class="player__still">
    <div class="ph ph--still"></div>
  </div>

  <div class="player__scrub"><i style="width: 38%"></i></div>
  <div class="player__elapsed">1:04:41</div>
  <div class="player__title">Sanctuary E1 Episode 1</div>
  <div class="player__bigplay">
    <svg viewBox="0 0 24 24" width="58" height="58" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <div class="player__transport">
    <svg class="player__ctrl player__ctrl--solid" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="player__ctrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
      <text x="12" y="15.4" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" stroke="none">10</text>
    </svg>
    <svg class="player__ctrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
      <text x="12" y="15.4" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" stroke="none">10</text>
    </svg>
    <svg class="player__ctrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/>
      <path d="M16 9a5 5 0 0 1 0 6"/>
      <path d="M19.4 18.4a9 9 0 0 0 0-12.8"/>
    </svg>
    <div class="player__vol">
      <svg class="player__ctrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/>
        <path d="M16 9a5 5 0 0 1 0 6"/>
      </svg>
      <div class="player__voltrack"><i style="width: 60%"></i></div>
    </div>
    <div class="player__grow"></div>
    <div class="player__time">18:07 / 1:52:06</div>
    <svg class="player__ctrl" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M2 16.1A5.1 5.1 0 0 1 7.1 21"/>
      <path d="M2 12.05A9 9 0 0 1 12 20"/>
      <path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
      <circle cx="6.2" cy="17.9" r="1.5" fill="#fff" stroke="none"/>
    </svg>
  </div>

  <button class="btn btn--ghost btn--sm note" id="btn-finish">Mark watched & exit</button>
</main>

<script src="../wire.js"></script>
</body>
</html>
