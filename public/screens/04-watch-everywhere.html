<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch everywhere</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .cluster { position: relative; height: 440px; }
  .cluster .device--tv { position: absolute; left: 0; top: 10px; width: 100%; }
  .cluster .device--phone { position: absolute; width: 132px; }

  /* Bare bars so each device screen reads as a screen rather than a flat slab. */
  .bars { position: absolute; inset: 0; padding: 7% 6%; display: flex; flex-direction: column; gap: 8px; }
  .bars i { display: block; height: 7px; border-radius: 2px; background: rgba(255,255,255,.62); }
  .bars i:nth-child(2) { width: 68%; }
  .bars i:nth-child(3) { width: 42%; height: 5px; }
  .bars--phone { padding: 12% 10%; gap: 9px; }
  .bars--phone i { height: 5px; }

  .cluster .device--phone--mid { left: 41%; top: 96px; z-index: 2; }
  .cluster .device--phone--side { left: 63%; top: 158px; z-index: 3; }
</style>
</head>
<body class="shell">
<div class="screen-tag">04 · Watch everywhere — ContentBlocks</div>

<section class="lblock lblock--flip">
  <div class="cluster">
    <div class="device device--tv">
      <div class="device__screen">
        <div class="ph ph--a"></div>
        <div class="bars"><i></i><i></i><i></i></div>
      </div>
    </div>

    <div class="device device--phone device--phone--mid">
      <div class="device__screen">
        <div class="ph ph--photo"></div>
        <div class="bars bars--phone"><i></i><i></i><i></i></div>
      </div>
    </div>

    <div class="device device--phone device--phone--side">
      <div class="device__screen">
        <div class="ph ph--photo"></div>
        <div class="bars bars--phone"><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>

  <div>
    <h2 class="lblock__title">Watch everywhere</h2>
    <p class="lblock__copy">Stream unlimited movies and TV shows on your phone, tablet, laptop, and TV.</p>
  </div>
</section>

</body>
</html>
