<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup strip</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .cta-col {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 4%;
    text-align: center;
  }
  .cta-head { margin: 0 0 30px; color: #fff; font-size: var(--fs-headline-1); line-height: 1.4; }
  .cta-form { display: flex; gap: 10px; }
  .cta-form .field { flex: 1; }
  .cta-gap { padding-top: 190px; padding-bottom: 190px; }
</style>
</head>
<body class="shell">
<div class="screen-tag">01 · signup strip — InputFields</div>

<nav class="nav nav--landing">
  <div class="nav__logo">NETFLIX</div>
  <div class="nav__links">
    <a class="nav__link" href="#">Browse by Languages</a>
  </div>
  <div class="nav__spacer"></div>
  <div class="nav__lang">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18"></path>
      <path d="M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path>
    </svg>
    <span>English</span>
  </div>
</nav>

<section class="cta-gap">
  <div class="cta-col">
    <p class="cta-head">Ready to watch? Enter your email to create or restart your membership.</p>
    <div class="cta-form">
      <div class="field">
        <div class="field__box">
          <span>Email address</span>
        </div>
      </div>
      <button class="btn btn--red" type="button">
        <span>Get Started</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>
</section>

</body>
</html>
