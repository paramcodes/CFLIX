<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Preview</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .stage { position: relative; }
  .behind { position: fixed; inset: 0; opacity: .34; pointer-events: none; }
  .behind__hero { position: absolute; inset: 0 0 auto 0; height: 62vh; }
  .behind__rows { padding: 64vh 4% 0; }
  .behind__block { position: relative; height: 150px; margin-bottom: 26px; border-radius: var(--r-sm); }
  .modal__title { text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .modal__act--play svg { fill: #fff; stroke: none; }
</style>
</head>
<body class="shell">
<div class="screen-tag">06 · movie preview modal — MoviePreview</div>

<div class="stage">

  <div class="behind">
    <nav class="nav">
      <div class="nav__logo">NETFLIX</div>
      <div class="nav__links">
        <a class="nav__link nav__link--active" href="#">Home</a>
        <a class="nav__link" href="#">TV Shows</a>
        <a class="nav__link" href="#">Movies</a>
        <a class="nav__link" href="#">New &amp; Popular</a>
        <a class="nav__link" href="#">My List</a>
        <a class="nav__link" href="#">Browse by Languages</a>
      </div>
      <div class="nav__spacer"></div>
      <div class="nav__tools">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5.2-2 5.2h15s-2-1.2-2-5.2A5.5 5.5 0 0 0 12 3.5z"/><path d="M10.2 18.2a2 2 0 0 0 3.6 0"/></svg>
        <div class="nav__avatar"></div>
      </div>
    </nav>

    <div class="behind__hero ph ph--a"></div>

    <div class="behind__rows">
      <div class="behind__block ph ph--b"></div>
      <div class="behind__block ph ph--c"></div>
      <div class="behind__block ph ph--d"></div>
    </div>
  </div>

  <div class="modal-stage">
    <div class="modal">
      <div class="modal__still">
        <div class="hero__bg hero__bg--car"></div>

        <div class="modal__close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </div>

        <h2 class="modal__title">HOUSE OF NINJAS</h2>

        <div class="modal__actions">
          <div class="modal__act modal__act--play">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
            <span>Play</span>
          </div>
          <div class="modal__act">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg>
          </div>
          <div class="modal__act">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10.6v8.6H4.6v-8.6H7z"/><path d="M7 10.6l4.1-6.9a2 2 0 0 1 3 2.3l-.8 3.5h4.4a2 2 0 0 1 2 2.4l-1.3 6a2 2 0 0 1-2 1.6H7"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
