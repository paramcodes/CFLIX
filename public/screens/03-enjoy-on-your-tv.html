<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enjoy on your TV</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  /* Miniature home page living inside the TV mockup. */
  .mini { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .mini-nav { display: flex; align-items: center; gap: 8px; height: 11%; padding: 0 3.5%; border-bottom: 1px solid rgba(255,255,255,.16); }
  .mini-logo { width: 11%; height: 4px; border-radius: 2px; background: var(--primary-red); }
  .mini-link { width: 7%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.5); }
  .mini-spacer { flex: 1; }
  .mini-hero { position: relative; flex: 1; background: linear-gradient(120deg, #0d0d0d, #242424 70%, #101010); display: flex; flex-direction: column; justify-content: center; gap: 9px; padding: 0 5%; }
  .mini-art { height: 9px; border-radius: 2px; background: #e9e9e9; }
  .mini-art--short { width: 46%; }
  .mini-art--tiny { height: 6px; width: 30%; background: rgba(255,255,255,.55); }
  .mini-word { color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .2px; }
  .mini-gloss { position: absolute; right: 5%; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: #fff; }
  .mini-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; height: 24%; padding: 0 3.5% 4%; }
  .mini-tile { position: relative; aspect-ratio: 16/9; border-radius: 2px; overflow: hidden; }
  .mini-tile .ph { position: static; height: 100%; }
</style>
</head>
<body class="shell">
<div class="screen-tag">03 · Enjoy on your TV — ContentBlocks</div>

<section class="lblock">
  <div>
    <h2 class="lblock__title">Enjoy on your TV</h2>
    <p class="lblock__copy">Watch on the go. Download offline to enjoy and watch on the go. Any way you watch.</p>
  </div>

  <div class="device device--tv">
    <div class="device__screen">
      <div class="mini">
        <div class="mini-nav">
          <i class="mini-logo"></i>
          <i class="mini-link"></i>
          <i class="mini-link"></i>
          <i class="mini-link"></i>
          <i class="mini-spacer"></i>
          <i class="mini-link"></i>
        </div>
        <div class="mini-hero">
          <span class="mini-word">Play</span>
          <i class="mini-art"></i>
          <i class="mini-art mini-art--short"></i>
          <i class="mini-art mini-art--tiny"></i>
          <svg class="mini-gloss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M15.5 15.5L21 21"></path>
          </svg>
          <span class="mini-word tiny">Search</span>
        </div>
        <div class="mini-row">
          <div class="mini-tile"><div class="ph ph--a"></div></div>
          <div class="mini-tile"><div class="ph ph--b"></div></div>
          <div class="mini-tile"><div class="ph ph--c"></div></div>
          <div class="mini-tile"><div class="ph ph--d"></div></div>
          <div class="mini-tile"><div class="ph ph--e"></div></div>
        </div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
