<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Title detail</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/css/detail.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <script type="module" src="/js/pages/nav.js"></script>
  </head>
  <body class="shell" data-page="detail">
    <nav class="nav">
      <a class="nav__logo" href="/home">
        <svg viewBox="0 0 124 44" aria-hidden="true">
          <defs><path id="arc-nav" d="M4 38 Q62 10 120 38" /></defs>
          <text>
            <textPath href="#arc-nav" startOffset="50%" text-anchor="middle">
              CFLIX
            </textPath>
          </text>
        </svg>
      </a>
      <div class="nav__spacer"></div>
      <div class="nav__tools">
        <button
          type="button"
          class="nav__bell"
          aria-disabled="true"
          title="Notifications are not implemented yet"
          aria-label="Notifications, not implemented yet"
        >
          <svg
            class="nav__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5.2-2 5.2h15s-2-1.2-2-5.2A5.5 5.5 0 0 0 12 3.5z"
            />
            <path d="M10.2 18.2a2 2 0 0 0 3.6 0" />
          </svg>
        </button>
        <button
          type="button"
          class="nav__avatar"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Profile menu"
        >
          <span class="nav__avatar-pic"></span>
        </button>
        <div
          class="nav__menu"
          id="nav-menu"
          role="menu"
          aria-label="Profile menu"
          hidden
        ></div>
      </div>
    </nav>
    <main class="detail">
      <section class="detail__hero">
        <div class="detail__backdrop" id="detail-backdrop"></div>
        <div class="detail__scrim"></div>

        <div class="detail__content wrap">
          <div class="detail__artwork" id="detail-artwork">
            <img class="detail__logo" id="detail-logo" alt="" hidden />
            <h1 class="detail__title" id="detail-heading">
              <span id="detail-title"></span>
            </h1>
          </div>

          <div class="detail__meta" id="detail-meta">
            <p class="detail__metarow" id="detail-metarow"></p>
          </div>

          <div class="detail__actions" id="detail-actions">
            <button class="btn btn--play" id="btn-play" type="button">
              <svg
                class="ico ico--solid"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
              Play
            </button>
            <button
              class="btn btn--ghost"
              type="button"
              data-soon="My List"
              aria-disabled="true"
              title="Coming soon"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              My List
            </button>
            <button
              class="btn btn--ghost"
              type="button"
              data-soon="Like"
              aria-disabled="true"
              title="Coming soon"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M7 10.5V21H4.6A1.6 1.6 0 0 1 3 19.4v-7.3a1.6 1.6 0 0 1 1.6-1.6H7zm0 0 4.3-7.1a1.9 1.9 0 0 1 3.4 1.7l-1.1 5.4h5.5a1.9 1.9 0 0 1 1.9 2.3l-1.1 7.2a2.1 2.1 0 0 1-2.1 1.8H7"
                />
              </svg>
              Like
            </button>
            <button
              class="btn btn--ghost"
              type="button"
              data-soon="Share"
              aria-disabled="true"
              title="Coming soon"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v14M6 13l6 6 6-6" />
              </svg>
              Share
            </button>
          </div>

          <p class="detail__soon" id="detail-soon" role="status"></p>
          <p class="detail__synopsis" id="detail-synopsis"></p>
          <dl class="detail__facts" id="detail-facts"></dl>
        </div>
      </section>

      <section class="detail__section" id="episodes-wrap">
        <div
          class="detail__seasons"
          id="detail-seasons"
          role="group"
          aria-label="Seasons"
          hidden
        ></div>
        <div id="episodes" class="detail__episodes"></div>
      </section>

      <section class="detail__section" id="related-wrap">
        <h2 class="row__title">More Like This</h2>
        <div class="row__rail" id="row-related"></div>
        <p class="detail__empty" id="related-empty" hidden></p>
      </section>
    </main>

    <script type="module" src="/wire.js"></script>
  </body>
</html>
