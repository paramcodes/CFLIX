<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | CFLIX</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <script type="module" src="/js/pages/nav.js"></script>
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body class="shell" data-page="home">
    <nav class="nav">
      <a class="nav__logo" href="/home">
        <svg viewBox="0 0 124 44" aria-hidden="true">
          <defs><path id="arc-nav" d="M4 38 Q62 10 120 38" /></defs>
          <text>
            <textPath href="#arc-nav" startOffset="50%" text-anchor="middle">
              CFLIX
            </textPath>
          </text>
        </svg>
      </a>
      <div class="nav__spacer"></div>
      <form id="search-form" style="display: flex; gap: 8px">
        <input
          id="search-input"
          placeholder="Search"
          style="
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
          "
        /><button class="btn btn--ghost btn--sm">Search</button>
      </form>
      <span id="who" style="color: #ccc; font-size: 13px"></span>
      <button class="btn btn--ghost btn--sm" id="btn-switch">
        Switch profile
      </button>
      <div class="nav__tools">
        <button
          type="button"
          class="nav__bell"
          aria-disabled="true"
          title="Notifications are not implemented yet"
          aria-label="Notifications, not implemented yet"
        >
          <svg
            class="nav__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4-2 5.2-2 5.2h15s-2-1.2-2-5.2A5.5 5.5 0 0 0 12 3.5z"
            />
            <path d="M10.2 18.2a2 2 0 0 0 3.6 0" />
          </svg>
        </button>
        <button
          type="button"
          class="nav__avatar"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Profile menu"
        >
          <span class="nav__avatar-pic"></span>
        </button>
        <div
          class="nav__menu"
          id="nav-menu"
          role="menu"
          aria-label="Profile menu"
          hidden
        ></div>
      </div>
    </nav>

    <main>
      <h1 class="sr-only">CFLIX home</h1>
      <header
        class="hero"
        id="hero"
        role="region"
        aria-roledescription="carousel"
        aria-label="Featured titles"
      ></header>

      <div class="rows rows--pad rows--overlap">
        <section class="row" data-row="trending" data-enter="false">
          <h2 class="row__title">Trending Now</h2>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll Trending Now left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--rank"
              id="row-trending"
              tabindex="0"
              role="group"
              aria-label="Trending Now, top 10"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll Trending Now right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
        </section>

        <section class="row" data-row="movies" data-enter="false">
          <h2 class="row__title">Movies</h2>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll Movies left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--landscape"
              id="row-movies"
              tabindex="0"
              role="group"
              aria-label="Movies"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll Movies right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
        </section>

        <section class="row" data-row="series" data-enter="false">
          <h2 class="row__title">Web Series</h2>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll Web Series left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--portrait"
              id="row-series"
              tabindex="0"
              role="group"
              aria-label="Web Series"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll Web Series right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
        </section>

        <section class="row" data-row="anime" data-enter="false">
          <h2 class="row__title">Anime &amp; Animation</h2>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll Anime and Animation left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--portrait"
              id="row-anime"
              tabindex="0"
              role="group"
              aria-label="Anime and Animation"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll Anime and Animation right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
        </section>

        <section class="row" data-row="continue" data-enter="false">
          <h2 class="row__title">Continue Watching</h2>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll Continue Watching left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--short"
              id="row-continue"
              tabindex="0"
              role="group"
              aria-label="Continue Watching"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll Continue Watching right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
        </section>

        <div id="rows-genre"></div>

        <section
          class="row"
          id="row-results-wrap"
          data-row="results"
          data-enter="false"
          hidden
        >
          <div class="row__head">
            <h2 class="row__title">Results</h2>
            <a class="btn btn--ghost btn--sm browse-link" hidden></a>
          </div>
          <div class="rail">
            <button
              class="rail__nav rail__nav--prev"
              type="button"
              aria-label="Scroll results left"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
              </svg>
            </button>
            <div
              class="row__rail row__rail--landscape"
              id="row-results"
              tabindex="0"
              role="group"
              aria-label="Search results"
            ></div>
            <button
              class="rail__nav rail__nav--next"
              type="button"
              aria-label="Scroll results right"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 4.5l7.5 7.5L9 19.5" />
              </svg>
            </button>
          </div>
          <p class="row__empty" hidden>No titles match that search.</p>
        </section>
      </div>
    </main>

    <template id="tpl-genre-row">
      <section class="row" data-genre-row data-enter="false">
        <h2 class="row__title"></h2>
        <div class="rail">
          <button
            class="rail__nav rail__nav--prev"
            type="button"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 4.5l-7.5 7.5 7.5 7.5" />
            </svg>
          </button>
          <div class="row__rail row__rail--portrait" tabindex="0" role="group"></div>
          <button class="rail__nav rail__nav--next" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 4.5l7.5 7.5L9 19.5" />
            </svg>
          </button>
        </div>
      </section>
    </template>

    <footer class="footer">
      <div class="wrap">
        <p class="footer__mark">CFLIX</p>
        <p class="footer__note">
          © 2026 CFLIX Design System screen prototype. Artwork is placeholder
          gradient only.
        </p>
      </div>
    </footer>

    <script type="module" src="/wire.js"></script>
  </body>
</html>
