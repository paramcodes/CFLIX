<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CFLIX · Watch</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/css/player.css" />
  </head>
  <body class="shell" data-page="player">
    <main class="player">
      <div class="player__stage">
        <div class="player__still">
          <div class="ph ph--still"></div>
          <img class="player__poster" alt="" hidden />
        </div>

        <div class="player__frame" hidden>
          <div id="yt-player"></div>
        </div>

        <div class="player__scrub">
          <span class="player__buffer"></span>
          <i></i>
          <input
            class="player__seek"
            id="seek"
            type="range"
            min="0"
            max="1"
            step="1"
            value="0"
            aria-label="Seek"
            aria-valuetext="0:00:00 of 0:00:00"
          />
        </div>

        <p class="player__elapsed" id="elapsed">0:00:00</p>

        <div class="player__head">
          <h1 class="player__title"></h1>
          <p class="player__epnum" id="epnum" hidden></p>
          <p class="player__notice">
            <span class="player__badge" id="media-badge" hidden></span>
            <span id="media-note"></span>
          </p>
        </div>

        <button class="player__bigplay" id="btn-bigplay" type="button" aria-label="Play" hidden>
          <svg viewBox="0 0 24 24" width="58" height="58" fill="currentColor" stroke="none" aria-hidden="true" focusable="false">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
      </div>

      <div class="player__transport">
        <button class="player__ctrl" id="btn-back" type="button" aria-label="Back to title">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M19 12H5" />
            <path d="m12 19-7-7 7-7" />
          </svg>
        </button>

        <button class="player__ctrl player__ctrl--solid" id="btn-toggle" type="button" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" data-icon="play" fill="currentColor" stroke="none" aria-hidden="true" focusable="false">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg viewBox="0 0 24 24" data-icon="pause" fill="currentColor" stroke="none" aria-hidden="true" focusable="false" hidden>
            <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
          </svg>
        </button>

        <button class="player__ctrl" id="btn-rew" type="button" aria-label="Skip back 10 seconds" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <text x="12" y="15.4" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">10</text>
          </svg>
        </button>

        <button class="player__ctrl" id="btn-fwd" type="button" aria-label="Skip forward 10 seconds" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <text x="12" y="15.4" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">10</text>
          </svg>
        </button>

        <div class="player__vol">
          <button class="player__ctrl" id="btn-mute" type="button" aria-label="Mute" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" data-icon="sound" aria-hidden="true" focusable="false">
              <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.4 18.4a9 9 0 0 0 0-12.8" />
            </svg>
            <svg viewBox="0 0 24 24" data-icon="mute" aria-hidden="true" focusable="false" hidden>
              <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" />
              <path d="M22 9l-6 6" />
              <path d="M16 9l6 6" />
            </svg>
          </button>
          <div class="player__voltrack">
            <i></i>
            <input
              class="player__volrange"
              id="vol"
              type="range"
              min="0"
              max="100"
              step="1"
              value="100"
              aria-label="Volume"
              aria-valuetext="100%"
              disabled
            />
          </div>
        </div>

        <div class="player__grow"></div>
        <p class="player__time" id="time">0:00:00 / 0:00:00</p>

        <button class="player__ctrl" id="btn-full" type="button" aria-label="Fullscreen" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 16.1A5.1 5.1 0 0 1 7.1 21" />
            <path d="M2 12.05A9 9 0 0 1 12 20" />
            <path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" />
            <circle cx="6.2" cy="17.9" r="1.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>

      <button class="btn btn--ghost btn--sm note" id="btn-finish" type="button">
        Mark watched &amp; exit
      </button>
    </main>

    <script type="module" src="/wire.js"></script>
  </body>
</html>
