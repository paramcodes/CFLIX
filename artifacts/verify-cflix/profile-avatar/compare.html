<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>avatar treatment compare</title>
<style>
  body { background: #141414; color: #b3b3b3; font: 14px Helvetica, Arial, sans-serif; margin: 24px; }
  .row { display: flex; gap: 20px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pic { width: 90px; height: 90px; border-radius: 6px; background: url(../../../public/avatar.png) center / cover no-repeat; }
  .blend-color-70 { background-image: linear-gradient(160deg, hsl(300 75% 55% / .7), hsl(5 75% 50% / .7)), url(../../../public/avatar.png); background-blend-mode: color; }
  .blend-color-45 { background-image: linear-gradient(160deg, hsl(300 75% 55% / .45), hsl(5 75% 50% / .45)), url(../../../public/avatar.png); background-blend-mode: color; }
  .blend-hue { background-image: linear-gradient(160deg, hsl(180 75% 55% / .7), hsl(240 75% 50% / .7)), url(../../../public/avatar.png); background-blend-mode: hue; }
  .rot120 { filter: hue-rotate(120deg); }
  .rot200s { filter: hue-rotate(200deg) saturate(1.25); }
</style>
</head>
<body>
<div class="row">
  <div class="tile"><div class="pic"></div><span>A raw</span></div>
  <div class="tile"><div class="pic blend-color-70"></div><span>B color 70</span></div>
  <div class="tile"><div class="pic blend-color-45"></div><span>C color 45</span></div>
  <div class="tile"><div class="pic blend-hue"></div><span>D hue blend</span></div>
  <div class="tile"><div class="pic rot120"></div><span>E hue-rotate 120</span></div>
  <div class="tile"><div class="pic rot200s"></div><span>F hue-rotate 200</span></div>
</div>
</body>
</html>
